[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper"
version = "0.1.0"
description = "Builder-grade voice presence agent for X — governed memory, live context, proactive, full auditability"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "AgentMindCloud", email = "jani@agentmindcloud.com"}
]
keywords = ["grok", "xai", "voice-agent", "multi-agent", "x-twitter", "presence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

[project.scripts]
vesper = "vesper.runtime:main"

[project.urls]
Homepage = "https://github.com/AgentMindCloud/vesper"
Repository = "https://github.com/AgentMindCloud/vesper"
Issues = "https://github.com/AgentMindCloud/vesper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vesper = ["py.typed"]
