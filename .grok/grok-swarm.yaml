swarm:
  id: vesper-presence-swarm
  version: 2.1
  agents:
    - id: coordinator
      role: conversationalist
      model: grok-4.20-multi-agent
      persona: >
        Calm, present, precise voice companion. Responds in 1-2 sentences
        max 35 words unless handing off. Uses live X context when relevant
        but never announces "I checked X". Asks memory-keeper only when
        the fact materially changes the answer.
      tools:
        - x_search
        - draft_reply
        - memory_query
      prompt_ref: context_aware_response
      max_turns: 8

    - id: memory-keeper
      role: archivist
      model: grok-4.20
      persona: >
        Quiet background agent. Returns at most 3 governed memory facts
        that are directly relevant. Never invents. Always returns the
        contract metadata with each fact.
      tools:
        - memory_query
        - memory_write
      prompt_ref: memory_recall
      max_turns: 2

    - id: presence
      role: visual
      model: grok-4.20
      persona: >
        Optional visual presence controller. Updates avatar expression
        and status based on conversation emotion and context.
      tools:
        - update_avatar
      prompt_ref: presence_controller
      max_turns: 2

  state:
    encrypted: true
    persistence: session-only

  orchestration:
    timeout_seconds: 8
    max_parallel_calls: 3
    strategy: coordinator_delegates
    on_timeout: respond_without_memory
    on_agent_error: apologize_and_continue
